# Поддомены флейворов checker.skyforest.ai / wayback.skyforest.ai.
#
# Оба обслуживаются ТЕМ ЖЕ Next-инстансом (PM2 skyforest.by), что и
# skyforest.ai: middleware приложения определяет флейвор по заголовку Host
# и сам ограничивает маршруты. Отдельные деплои не нужны.
#
# Установка на VPS (вручную):
#   1. DNS: A-записи checker.skyforest.ai и wayback.skyforest.ai -> IP VPS
#      (или CNAME на skyforest.ai).
#   2. Скопировать этот файл в /etc/nginx/sites-available/skyforest-flavors.conf,
#      проверить proxy_pass: порт должен совпадать с существующим
#      server-блоком skyforest.ai (см. /etc/nginx/sites-enabled/*).
#   3. ln -s /etc/nginx/sites-available/skyforest-flavors.conf /etc/nginx/sites-enabled/
#   4. Сертификаты: certbot --nginx -d checker.skyforest.ai -d wayback.skyforest.ai
#      (certbot допишет ssl_* директивы и редирект с 80 сам).
#   5. nginx -t && systemctl reload nginx
#
# Проверка: curl -s https://checker.skyforest.ai | grep "Mushroom Checker"

server {
    listen 80;
    listen [::]:80;
    server_name checker.skyforest.ai wayback.skyforest.ai;

    # ВАЖНО: сверить порт с действующим конфигом skyforest.ai
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;              # флейвор определяется по Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
